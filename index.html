<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpenwand — 岩场条件</title>
<meta name="theme-color" content="#1c2321">
<meta name="description" content="慕尼黑周边阿尔卑斯岩场的天气、日照、线路信息">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alpenwand">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<style>
  :root{
    --bg:#1c2321;
    --panel:#242e2b;
    --panel-2:#2c3733;
    --line:#3a4844;
    --ink:#edeae3;
    --ink-dim:#a8b3ae;
    --sun:#e8871e;
    --sun-soft:#f2c14e;
    --glacier:#5b8c9e;
    --sport:#5b8c9e;
    --multi:#c0693f;
    --good:#7fae6e;
    --mid:#e0b04a;
    --bad:#b6543f;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);}
  body{color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header{
    padding:20px 20px 14px;
    border-bottom:1px solid var(--line);
    background:radial-gradient(120% 100% at 100% 0%, rgba(232,135,30,0.10), transparent 60%), var(--bg);
    flex:none;
  }
  header h1{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  header .sub{color:var(--ink-dim);font-size:12.5px;font-family:'IBM Plex Mono',monospace;}
  .toolbar{
    display:flex;gap:8px;padding:12px 20px;overflow-x:auto;border-bottom:1px solid var(--line);
    flex:none;align-items:center;
    scrollbar-width:none;
    /* 右边缘渐隐:提示这一条能横向滑动(日期按钮在窄屏下会被截断在外面) */
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 30px),transparent);
    mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 30px),transparent);
  }
  .toolbar::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-dim);font-size:12.5px;font-family:'IBM Plex Mono',monospace;
    cursor:pointer;white-space:nowrap;
  }
  .chip.active{background:var(--sun);border-color:var(--sun);color:#1c2321;font-weight:600;}
  .chip-sep{width:1px;background:var(--line);flex:none;align-self:stretch;margin:2px 4px;}
  .legend{
    display:flex;column-gap:16px;row-gap:4px;padding:2px 20px 12px;font-size:11px;color:var(--ink-dim);
    font-family:'IBM Plex Mono',monospace;flex:none;align-items:center;flex-wrap:wrap;line-height:1.7;
  }
  .legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
  .legend .imp-link{margin-left:auto;color:var(--ink-dim);text-decoration:none;flex:none;}
  @media (max-width:480px){
    .toolbar{gap:6px;padding:10px 14px;}
    .chip{padding:6px 10px;font-size:12px;}
    .legend{padding:2px 14px 10px;column-gap:12px;font-size:10.5px;}
  }
  #map{flex:1;position:relative;z-index:1;}
  #map .leaflet-container{background:#12403a;}
  .crag-marker{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:50%;
    border:2.5px solid var(--bg);
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;color:#101613;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
  }
  .fab{
    position:fixed;right:18px;bottom:18px;z-index:1200;
    width:52px;height:52px;border-radius:50%;
    background:var(--sun);color:#1c2321;border:none;font-size:26px;font-weight:700;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;text-decoration:none;
  }
  .feedback-link{
    display:inline-block;margin:0 18px 18px;padding:10px 16px;border-radius:9px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);
    font-size:12.5px;text-decoration:none;text-align:center;width:calc(100% - 36px);
  }
  .sheet{
    position:fixed;left:0;right:0;bottom:0;max-height:82vh;
    background:var(--panel);border-radius:18px 18px 0 0;
    transform:translateY(105%);transition:transform .25s ease;
    z-index:1300;box-shadow:0 -10px 30px rgba(0,0,0,.5);
    overflow-y:auto;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 2px;}
  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1250;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}

  .crag-head{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 18px 10px;}
  .crag-head h2{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 3px;}
  .crag-head .loc{font-size:11.5px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;}
  .score{text-align:right;flex:none;margin-left:12px;}
  .score .val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;line-height:1;}
  .score .lbl{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;}
  .contour{height:1px;margin:0 18px;background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px);}
  .body-grid{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:14px 18px 16px;}
  @media (max-width:420px){.body-grid{grid-template-columns:104px 1fr;}}
  .dial-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .dial-cap{font-size:10px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;text-align:center;}
  .days{display:flex;flex-direction:column;gap:8px;}
  .day-row{
    display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;
    font-size:12.5px;padding:8px 9px;border-radius:8px;background:var(--panel-2);
    border:1px solid transparent;
  }
  .day-row.best{border-color:var(--sun);}
  .day-row.best .d{color:var(--sun-soft);font-weight:600;}
  .day-row.sel{background:rgba(91,140,158,.16);}
  .day-row .d{font-family:'IBM Plex Mono',monospace;color:var(--ink-dim);}
  .day-row .bar-wrap{height:8px;border-radius:5px;background:#1c2321;overflow:hidden;}
  .day-row .bar{height:100%;border-radius:5px;}
  .day-row .stats{display:flex;flex-direction:column;gap:2px;align-items:flex-end;font-family:'IBM Plex Mono',monospace;font-size:10.5px;}
  .day-row .stats .t{color:var(--ink);font-size:12px;}
  .day-row .stats .extra{display:flex;gap:7px;color:var(--ink-dim);}
  .day-row .stats .rain{color:#7db8d6;}
  .day-row .stats .cloud{color:var(--ink-dim);}
  .day-row .stats .sunh{color:var(--sun-soft);}
  .routes{padding:0 18px 18px;}
  .filter-chip{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:rgba(232,135,30,.12);border:1px solid var(--sun);border-radius:8px;
    padding:8px 12px;margin:0 0 10px;font-size:12px;color:var(--sun-soft);font-family:'IBM Plex Mono',monospace;
  }
  .filter-chip button{background:none;border:none;color:var(--ink-dim);font-size:11px;cursor:pointer;padding:0;font-family:'IBM Plex Mono',monospace;}
  .routes summary{cursor:pointer;font-size:12px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;padding:6px 0;}
  .sector-group{margin-left:4px;}
  .sector-group summary{cursor:pointer;font-size:11.5px;color:var(--ink);font-family:'IBM Plex Mono',monospace;padding:8px 0 4px;border-top:1px solid var(--line);}
  .sector-group .route{padding-left:8px;}
  .route{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .route .name{font-weight:500;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:999px;margin-left:6px;}
  .tag.sport{background:rgba(91,140,158,.2);color:var(--sport);}
  .tag.multi{background:rgba(192,105,63,.2);color:var(--multi);}
  .tag.rain{background:rgba(91,140,158,.2);color:var(--glacier);}
  .rain-badge{display:inline-block;margin:6px 6px 0 0;padding:3px 9px;border-radius:999px;font-size:11px;font-family:'IBM Plex Mono',monospace;}
  .rain-badge.good{background:rgba(127,174,110,.18);color:var(--good);}
  .rain-badge.bad{background:rgba(182,84,63,.18);color:var(--bad);}
  .grade{font-family:'IBM Plex Mono',monospace;color:var(--sun-soft);font-weight:600;}
  .empty{text-align:center;color:var(--ink-dim);padding:22px 20px;font-size:13px;}
  .hint{font-size:11px;color:var(--ink-dim);line-height:1.5;margin-top:8px;}
  a{color:var(--glacier);}
  .header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .lang-switch{display:flex;gap:4px;flex:none;}
  .lang-switch button{
    padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink-dim);font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;
  }
  .lang-switch button.active{background:var(--sun);border-color:var(--sun);color:#1c2321;font-weight:600;}
  .search-wrap{position:relative;margin-top:10px;}
  #cragSearch{
    width:100%;max-width:340px;padding:8px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:13px;font-family:'Inter',sans-serif;
  }
  #cragSearch::placeholder{color:var(--ink-dim);}
  .search-results{
    position:absolute;top:calc(100% + 4px);left:0;width:100%;max-width:340px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    z-index:1500;display:none;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .search-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);}
  .search-item:last-child{border-bottom:none;}
  .search-item:hover{background:var(--panel-2);}
  .search-item .sec{color:var(--ink-dim);font-size:11px;margin-left:6px;}
  .search-empty{padding:9px 12px;font-size:12px;color:var(--ink-dim);}
  .cluster-marker{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:50%;
    border:2.5px solid var(--bg);
    color:#101613;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
  }
  .cluster-marker .cnt{
    position:absolute;bottom:-5px;right:-8px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    font-size:9px;font-weight:600;padding:1px 5px;border-radius:999px;line-height:1.4;
  }
  .grade-hist{margin:0 0 12px;}
  .gh-title{font-size:10.5px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;margin-bottom:4px;}
  .gh-bars{display:flex;align-items:flex-end;gap:3px;}
  .gh-col{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;max-width:34px;}
  .gh-bar{width:100%;background:var(--sport);border-radius:3px 3px 0 0;min-height:2px;}
  .gh-lbl{font-size:9px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Alpenwand</h1>
    <div class="lang-switch" id="langSwitch"></div>
  </div>
  <div class="sub" id="subTitle">慕尼黑 · 阿尔卑斯岩场地图 · 日照 / 天气 / 线路</div>
  <div class="search-wrap">
    <input id="cragSearch" type="search" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</header>

<div class="toolbar" id="filterBar"></div>
<div class="legend" id="legendBar">
  <span><span class="dot" style="background:var(--good)"></span>指数≥70 适合去</span>
  <span><span class="dot" style="background:var(--mid)"></span>40–69 看情况</span>
  <span><span class="dot" style="background:var(--bad)"></span>&lt;40 大概率湿</span>
  <a class="imp-link" href="impressum.html">Impressum</a>
</div>

<div id="map"></div>

<a class="fab" href="mailto:kontakt@felsradar.com?subject=Felsradar%20Feedback" title="反馈 / 建议新增岩场">✉️</a>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div id="sheetContent"></div>
</div>

// 少数几个岩场分区名字里带的中文备注(比如护鸟关闭日期),翻译成对应语言时顺手替换掉
const SECTOR_NOTE_MAP = {
  '每年1/1–7/31关闭': {en:'closed annually Jan 1–Jul 31', de:'jährlich geschlossen 1.1.–31.7.'},
  '每年10/1–3/31关闭': {en:'closed annually Oct 1–Mar 31', de:'jährlich geschlossen 1.10.–31.3.'},
  '每年1/15–7/31关闭': {en:'closed annually Jan 15–Jul 31', de:'jährlich geschlossen 15.1.–31.7.'},
  '每年2/1–7/31关闭': {en:'closed annually Feb 1–Jul 31', de:'jährlich geschlossen 1.2.–31.7.'},
  '6月1日前关闭,是否每年固定未知': {en:'closed until Jun 1 (unclear if this recurs yearly)', de:'bis 1. Juni geschlossen (unklar ob jährlich)'},
  '顶部禁止翻出': {en:'no top-out (Ausstiegsverbot)', de:'Ausstiegsverbot'},
  '多段路线(东南向)': {en:'multi-pitch routes (SE-facing)', de:'Mehrseillängen (Südost)'},
  '多段路线(北向大长线)': {en:'multi-pitch routes (N-facing, long alpine lines)', de:'Mehrseillängen (Nord, lange alpine Linien)'},
  '多段路线(南偏东南向)': {en:'multi-pitch routes (S/SE-facing)', de:'Mehrseillängen (Süd/Südost)'},
  '多段路线(南向)': {en:'multi-pitch routes (S-facing)', de:'Mehrseillängen (Süd)'}
};
let LANG = (()=>{ try{ return localStorage.getItem(LANG_KEY) || 'zh'; }catch(e){ return 'zh'; } })();
function t(key){ const v = (I18N[LANG]||I18N.zh)[key]; return v!=null ? v : (I18N.zh[key]||''); }
function localizeSector(name){
  if(!name || LANG==='zh') return name;
  let out = name;
  for(const zh in SECTOR_NOTE_MAP){
    if(out.includes(zh)) out = out.replace(zh, SECTOR_NOTE_MAP[zh][LANG] || zh);
  }
  return out;
}
function setLang(lang){
  LANG = lang;
  try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
  applyStaticI18n();
  renderFilterBar();
  rebuildMarkers();
  if(currentSheetCragId) renderSheetContent();
}
function applyStaticI18n(){
  document.getElementById('subTitle').textContent = t('subtitle');
  document.querySelectorAll('#legendBar > span').forEach((el,i)=>{
    const key = ['legendGood','legendMid','legendBad'][i];
    const dot = el.querySelector('.dot');
    el.innerHTML = '';
    if(dot) el.appendChild(dot);
    el.append(document.createTextNode(t(key)));
  });
  document.querySelector('.fab').title = t('fabTitle');
  document.getElementById('cragSearch').placeholder = t('searchPlaceholder');
  document.getElementById('langSwitch').innerHTML = ['zh','en','de'].map(l=>
    `<button data-lang="${l}" class="${LANG===l?'active':''}">${l.toUpperCase()}</button>`
  ).join('');
  document.querySelectorAll('#langSwitch button').forEach(b=>{
    b.onclick = ()=> setLang(b.dataset.lang);
  });
  document.documentElement.lang = LANG;
}

function dayScoreFromWx(wx, i){

  if(p==null && cl==null) return null;
  return scoreFor({precip:p, cloud:cl});
}

function load(){

function dirToCompass(deg){
  const dirs = I18N[LANG]?.dirs || I18N.zh.dirs;
  return dirs[Math.round(deg/45)%8];
}

// --- weather ---
const weatherCache = {};
async function fetchWeather(lat, lon){
  const key = lat+','+lon;
  if(weatherCache[key]) return weatherCache[key];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,cloud_cover_mean&timezone=auto&forecast_days=4`;
  try{
    const res = await fetch(url);
    const data = await res.json();
    weatherCache[key] = data;
    return data;
  }catch(e){ return null; }
}

// --- sun exposure (简化模型:按太阳方位角是否落在壁面朝向±95°内估算受光小时数,未计入地形互相遮挡) ---
function sunHoursForFace(date, lat, lon, faceDir){
  const times = SunCalc.getTimes(date, lat, lon);
  if(!times.sunrise || !times.sunset || isNaN(times.sunrise)) return 0;
  let hours = 0;
  const start = times.sunrise.getTime(), end = times.sunset.getTime(), step = 30*60*1000;
  for(let t=start; t<=end; t+=step){
    const pos = SunCalc.getPosition(new Date(t), lat, lon);
    if(pos.altitude < 0.05) continue;
    let az = (pos.azimuth * 180/Math.PI + 180) % 360;
    let diff = Math.abs(az - faceDir);
    if(diff > 180) diff = 360 - diff;
    if(diff <= 95) hours += 0.5;
  }
  return hours;
}

function drawDial(faces, date, lat, lon, selectedDir){
  // label 半径(38)必须留够文字宽度余量,不然"北/南/东/西"这种正朝向的字会被 viewBox 边缘切掉(斜向的因为 x/y 各分摊一半,之前一直没露出这个问题)
  const size = 110, c = size/2, r = 30, labelR = 38;
  let marks = '';
  faces.forEach(f=>{
    const rad = (f.dir-90)*Math.PI/180;
    const x1 = c + Math.cos(rad)*(r-13), y1 = c + Math.sin(rad)*(r-13);
    const x2 = c + Math.cos(rad)*(r+5), y2 = c + Math.sin(rad)*(r+5);
    const h = sunHoursForFace(date, lat, lon, f.dir);
    const lit = h >= 2;
    const selected = selectedDir!=null && f.dir===selectedDir;
    const lineColor = (selected || lit) ? 'var(--sun)' : 'var(--line)';
    const textColor = (selected || lit) ? 'var(--sun-soft)' : 'var(--ink-dim)';
    const lx = c + Math.cos(rad)*labelR, ly = c + Math.sin(rad)*labelR;
    const label = dirToCompass(f.dir);
    marks += `<g class="face-spoke" data-dir="${f.dir}" style="cursor:pointer">
      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${lineColor}" stroke-width="${selected?6:4}" stroke-linecap="round" pointer-events="none"/>
      <text x="${lx}" y="${ly}" fill="${textColor}" font-size="8.5" font-weight="${selected?'700':'500'}" text-anchor="middle" font-family="IBM Plex Mono" pointer-events="none">${label}</text>
      <circle cx="${(x1+lx)/2}" cy="${(y1+ly)/2}" r="16" fill="transparent" pointer-events="all"/>
    </g>`;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <circle cx="${c}" cy="${c}" r="3" fill="var(--ink-dim)"/>
    ${marks}
  </svg>`;
}

// 今日指数:100分起,按降水概率和云量扣分。
// 降水概率影响更大(权重0.9,湿滑/淋雨风险直接相关),云量影响较小(权重0.35,主要影响日照和体感温度)。
// ≥70 记为"好天"(绿色),40-69 为"一般"(黄色),<40 为"差"(红色,大概率湿或阴)。
function scoreFor(day){
  if(!day) return {val:null, cls:'', color:'var(--ink-dim)'};
  const rain = day.precip ?? 0, cloud = day.cloud ?? 0;
  let s = 100 - rain*0.9 - cloud*0.35;
  s = Math.max(0, Math.min(100, Math.round(s)));
  let cls = s>=70?'good':(s>=40?'mid':'bad');
  let color = s>=70?'var(--good)':(s>=40?'var(--mid)':'var(--bad)');
  return {val:s, cls, color};
}

function markerColor(c, wx){
  const s = dayScoreFromWx(wx, selectedDay);
  return s ? s.color : 'var(--ink-dim)';
}

// "今日最佳朝向"不能只看晒太阳时长——夏天暴晒的南墙反而难受(石头烫手、体感差),冬天才是晒得越久越好。
// 阈值凭经验粗略定的:最高温≥26°C 算"热"(找阴面),≤12°C 算"冷"(找阳面),中间正常按晒太阳时长排。没有天气数据时退回原来的纯晒太阳时长排序。
function pickBestFace(sunHoursList, tmax){
  if(!sunHoursList.length) return null;
  if(tmax==null) return [...sunHoursList].sort((a,b)=>b.h-a.h)[0];
  if(tmax>=26) return [...sunHoursList].sort((a,b)=>a.h-b.h)[0]; // 热:优先阴面
  return [...sunHoursList].sort((a,b)=>b.h-a.h)[0]; // 冷/常温:优先晒得久
}
function bestFaceReason(tmax){
  if(tmax==null) return '';
  if(tmax>=26) return t('reasonHot');
  if(tmax<=12) return t('reasonCold');
  return '';
}

async function buildSheetHTML(c){
  const wx = await fetchWeather(c.lat, c.lon);
  let days = [];
  if(wx && wx.daily){
    const dd = wx.daily;
    for(let i=0;i<dd.time.length;i++){
      days.push({date:dd.time[i], tmax:dd.temperature_2m_max[i], tmin:dd.temperature_2m_min[i],
        precip:dd.precipitation_probability_max[i], cloud:dd.cloud_cover_mean[i]});
    }
  }
  // 整个头部(大分数、最佳朝向、罗盘日照)都按工具栏选中的日期算,不再固定是今天
  const selDate = new Date(Date.now() + selectedDay*86400000);
  const todaySunHours = c.faces.map(f=>({face:f, h: sunHoursForFace(selDate, c.lat, c.lon, f.dir)}));
  const bestFace = pickBestFace(todaySunHours, days[selectedDay]?.tmax);
  const sc = scoreFor(days[selectedDay]);
  const wdSel = selDate.toLocaleDateString(t('locale'),{weekday:'short'});
  const scoreLbl = selectedDay===0 ? t('todayIndex') : `${wdSel} · ${t('scoreWord')}`;
  const bestLbl = selectedDay===0 ? t('bestOrientation') : t('bestOrientationDay')(wdSel);

  // 预报里分数最高的那天高亮显示(★),分数并列时取最早的一天;当前选中的日期加背景色
  const dayScores = days.map(d=>scoreFor(d).val);
  const bestDayIdx = dayScores.length ? dayScores.indexOf(Math.max(...dayScores.filter(v=>v!=null))) : -1;
  const dayRows = days.map((d,i)=>{
    const s = scoreFor(d);
    const wd = new Date(d.date).toLocaleDateString(t('locale'),{weekday:'short'});
    const sunH = c.faces.length ? Math.max(...c.faces.map(f=>sunHoursForFace(new Date(d.date), c.lat, c.lon, f.dir))) : 0;
    const isBest = i===bestDayIdx;
    const isSel = i===selectedDay;
    return `<div class="day-row${isBest?' best':''}${isSel?' sel':''}">
      <div class="d">${wd}${isBest?'★':''}</div>
      <div class="bar-wrap"><div class="bar" style="width:${s.val}%;background:${s.color}"></div></div>
      <div class="stats">
        <div class="t">${Math.round(d.tmin)}° / ${Math.round(d.tmax)}°</div>
        <div class="extra">
          <span class="rain">💧${Math.round(d.precip)}%</span>
          <span class="cloud">☁${Math.round(d.cloud)}%</span>
          <span class="sunh">☀${sunH.toFixed(1)}h</span>
        </div>
      </div>
    </div>`;
  }).join('');

  const activeRoutes = sheetFaceFilter==null ? c.routes : c.routes.filter(r=>r.dir===sheetFaceFilter);
  const routesByType = { sport: activeRoutes.filter(r=>r.type==='sport'), multi: activeRoutes.filter(r=>r.type==='multi') };
  function routeList(list){
    return list.map(r=>`
      <div class="route">
        <div><span class="name">${r.name}</span><span class="tag ${r.type}">${r.type==='sport'?t('tagSport'):t('tagMulti')+(r.pitches||'?')}</span>${r.rain==='yes'?`<span class="tag rain">${t('tagRainYes')}</span>`:r.rain==='partial'?`<span class="tag rain">${t('tagRainPartial')}</span>`:''}</div>
        <div><span class="grade">${r.grade}</span><span class="meta"> · ${dirToCompass(r.dir)}${t('metaFacing')}</span></div>
      </div>`).join('');
  }
  // 分区较多时(比如 Kallmünz 这种一个岩场下有十几个独立岩壁)按 sector 字段分组显示,避免几百条线路堆成一坨
  function routeListMaybeGrouped(list){
    if(!list.some(r=>r.sector)) return routeList(list);
    const order = [], groups = {};
    list.forEach(r=>{
      const key = r.sector || '—';
      if(!groups[key]){ groups[key]=[]; order.push(key); }
      groups[key].push(r);
    });
    return order.map(key=>`<details class="sector-group"><summary>${localizeSector(key)} (${groups[key].length})</summary>${routeList(groups[key])}</details>`).join('');
  }
  // 难度分布小直方图:按难度的数字前缀分桶(UIAA "7+"→7,法国制 "6a"→6)。
  // 两种难度体系数字含义不同,这只是个粗略的"这个岩场偏简单还是偏难"参考,标题里注明了;罗马数字("V+")和无难度的跳过。
  function gradeHistogram(list){
    const buckets = {};
    list.forEach(r=>{ const n = parseInt(r.grade); if(!isNaN(n) && n>=1 && n<=12) buckets[n]=(buckets[n]||0)+1; });
    const keys = Object.keys(buckets).map(Number).sort((a,b)=>a-b);
    if(keys.length<2) return '';
    const max = Math.max(...Object.values(buckets));
    let bars='';
    for(let k=keys[0]; k<=keys[keys.length-1]; k++){
      const v = buckets[k]||0;
      const h = v ? Math.max(4, Math.round(v/max*34)) : 2;
      bars += `<div class="gh-col"><div class="gh-bar" style="height:${h}px" title="${k}: ${v}"></div><div class="gh-lbl">${k}</div></div>`;
    }
    return `<div class="grade-hist"><div class="gh-title">${t('histTitle')}</div><div class="gh-bars">${bars}</div></div>`;
  }
  const gradeHist = gradeHistogram(activeRoutes);
  const noRoutes = activeRoutes.length===0
    ? (sheetFaceFilter!=null
        ? `<div class="hint">${t('noRoutesThisFace')}</div>`
        : `<div class="hint">${t('noRoutesAtAll')}</div>`)
    : '';
  const filterChip = sheetFaceFilter!=null
    ? `<div class="filter-chip"><span>${t('onlyFacing')(dirToCompass(sheetFaceFilter))} (${activeRoutes.length})</span><button data-clear-filter type="button">${t('clearFilter')}</button></div>`
    : '';
  const rainRouteCount = c.routes.filter(r=>r.rain==='yes'||r.rain==='partial').length;
  let rainBadge = '';
  if(c.rain==='yes') rainBadge = `<div class="rain-badge good">${t('rainBadgeYes')}</div>`;
  else if(c.rain==='partial') rainBadge = `<div class="rain-badge good">${t('rainBadgePartial')}</div>`;
  else if(c.rain==='no') rainBadge = `<div class="rain-badge bad">${t('rainBadgeNo')}</div>`;
  else if(rainRouteCount>0) rainBadge = `<div class="rain-badge good">${t('rainBadgeSome')(rainRouteCount)}</div>`;

  // 海拔:天气 API 的响应里自带(是气象格点的海拔,不是岩壁精确海拔,所以标"≈")
  const elev = (wx && typeof wx.elevation==='number') ? Math.round(wx.elevation) : null;
  // 限制/关闭警告:从已录入的分区名/朝向标注里检测"关闭"(季节性封禁)或"禁止"(比如 Rosenstein 的 Ausstiegsverbot 顶部禁止翻出)字样,有就在头部亮警告条
  const hasClosures = c.routes.some(r=>r.sector && (r.sector.includes('关闭') || r.sector.includes('禁止')))
    || c.faces.some(f=>f.label && (f.label.includes('关闭') || f.label.includes('禁止')));
  const closureBadge = hasClosures ? `<div class="rain-badge bad">${t('closureWarn')}</div>` : '';

  return `
    <div class="crag-head">
      <div>
        <h2>${c.name}</h2>
        <div class="loc">${c.lat.toFixed(3)}, ${c.lon.toFixed(3)} · <a href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lon}" target="_blank" rel="noopener">${t('navigate')} ↗</a></div>
        ${elev!=null?`<div class="loc">${t('elevLabel')} ≈${elev} m</div>`:''}
        <div class="loc">${bestLbl} ${bestFace?dirToCompass(bestFace.face.dir):'—'} (${bestFace?bestFace.h.toFixed(1):'0'}${t('directSun')}${bestFaceReason(days[selectedDay]?.tmax)})</div>
        ${closureBadge}
        ${rainBadge}
      </div>
      <div class="score">
        <div class="val" style="color:${sc.color}">${sc.val ?? '—'}</div>
        <div class="lbl">${scoreLbl}</div>
      </div>
    </div>
    <div class="contour"></div>
    <div class="body-grid">
      <div class="dial-wrap">
        ${drawDial(c.faces, selDate, c.lat, c.lon, sheetFaceFilter)}
        <div class="dial-cap">${t('dialCap')}${c.faces.length>1?t('dialCapFilterHint'):''}</div>
      </div>
      <div class="days">${dayRows || `<div class="hint">${t('weatherFailed')}</div>`}</div>
    </div>
    <div class="routes">
      ${filterChip}
      ${gradeHist}
      ${routesByType.sport.length?`<details open><summary>${t('sportRoutes')} (${routesByType.sport.length})</summary>${routeListMaybeGrouped(routesByType.sport)}</details>`:''}
      ${routesByType.multi.length?`<details open><summary>${t('multiRoutes')} (${routesByType.multi.length})</summary>${routeListMaybeGrouped(routesByType.multi)}</details>`:''}
      ${noRoutes}
    </div>
    ${CRAG_SOURCES[c.id]?`<div class="hint" style="padding:0 18px 4px;">${t('sourceLabel')}: <a href="${CRAG_SOURCES[c.id].url}" target="_blank" rel="noopener">${CRAG_SOURCES[c.id].name} ↗</a></div>`:''}
    <a class="feedback-link" href="https://github.com/Mengmeng0666/Weather-for-the-crags/issues/new?title=${encodeURIComponent(t('feedbackTitlePrefix')+c.name)}" target="_blank" rel="noopener">${t('feedbackLink')}</a>
  `;
}

async function renderSheetContent(){
  const c = crags.find(x=>x.id===currentSheetCragId);
  if(!c) return;
  const content = document.getElementById('sheetContent');
  content.innerHTML = await buildSheetHTML(c);
  content.querySelectorAll('.face-spoke').forEach(el=>{
    el.onclick = ()=> setFaceFilter(parseFloat(el.dataset.dir));
  });
  const clearBtn = content.querySelector('[data-clear-filter]');
  if(clearBtn) clearBtn.onclick = ()=>{ sheetFaceFilter = null; renderSheetContent(); };
}

function setFaceFilter(dir){
  sheetFaceFilter = (sheetFaceFilter===dir) ? null : dir;
  renderSheetContent();
}

async function openSheet(id){
  const c = crags.find(x=>x.id===id);
  if(!c) return;
  currentSheetCragId = id;
  sheetFaceFilter = null;
  const sheet = document.getElementById('sheet');
  const content = document.getElementById('sheetContent');
  content.innerHTML = `<div class="empty">${t('loading')(c.name)}</div>`;
  document.getElementById('sheetBackdrop').classList.add('open');
  sheet.classList.add('open');
  await renderSheetContent();
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheetBackdrop').classList.remove('open');
}
document.getElementById('sheetBackdrop').onclick = closeSheet;

// --- map ---
function initMap(){
  map = L.map('map', {zoomControl:true}).setView([47.6, 11.6], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:18,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);
}

let clusterGroup = null;
async function rebuildMarkers(){
  // 上一版是逐个 await 天气(27个岩场要排队十几秒),改成并发一起请求;
  // 缩小地图时相邻岩场的圆点会挤在一起,用 markercluster 聚合成一个数字圆点,点击自动放大散开。
  // markercluster 是 CDN 加载的,万一加载失败就退回原来的"直接铺在地图上"。
  if(clusterGroup){ map.removeLayer(clusterGroup); clusterGroup = null; }
  Object.values(markers).forEach(m=>map.removeLayer(m));
  markers = {};
  const filtered = crags.filter(c=>{
    if(filter.type!=='all' && !c.routes.some(r=>r.type===filter.type)) return false;
    if(filter.rain && !cragHasRainOption(c)) return false;
    return true;
  });
  const supportsCluster = typeof L.markerClusterGroup === 'function';
  if(supportsCluster){
    clusterGroup = L.markerClusterGroup({
      maxClusterRadius: 42,
      showCoverageOnHover: false,
      // 聚合点不只显示数量:主体显示这一片里最高的今日指数并按红黄绿着色(天气一眼预览不丢),右下角小角标是合并的岩场数
      iconCreateFunction: cluster => {
        const children = cluster.getAllChildMarkers();
        const scores = children.map(m=>m.options.cragScore).filter(v=>typeof v==='number');
        const best = scores.length ? Math.max(...scores) : null;
        const color = best==null ? 'var(--ink-dim)' : (best>=70?'var(--good)':(best>=40?'var(--mid)':'var(--bad)'));
        return L.divIcon({
          className:'',
          html:`<div class="cluster-marker" style="background:${color}">${best==null?'—':best}<span class="cnt">×${children.length}</span></div>`,
          iconSize:[40,40], iconAnchor:[20,20]
        });
      }
    });
  }
  const wxList = await Promise.all(filtered.map(c=>fetchWeather(c.lat, c.lon)));
  filtered.forEach((c,i)=>{
    const wx = wxList[i];
    const color = markerColor(c, wx);
    const dayScore = dayScoreFromWx(wx, selectedDay);
    const score = dayScore ? dayScore.val : '—';
    const icon = L.divIcon({
      className:'',
      html:`<div class="crag-marker" style="background:${color}">${score}</div>`,
      iconSize:[38,38], iconAnchor:[19,19]
    });
    const m = L.marker([c.lat, c.lon], {icon, cragScore: (typeof score==='number' ? score : null)});
    m.bindTooltip(c.name, {direction:'top', offset:[0,-16]});
    m.on('click', ()=>openSheet(c.id));
    if(clusterGroup){ clusterGroup.addLayer(m); } else { m.addTo(map); }
    markers[c.id] = m;
  });
  if(clusterGroup) map.addLayer(clusterGroup);
}

function renderFilterBar(){
  const bar = document.getElementById('filterBar');
  const opts = [['all',t('filterAll')],['sport',t('filterSport')],['multi',t('filterMulti')]];
  // 日期切换:今天 + 之后三天(和 open-meteo 拉的 forecast_days=4 对应),按当地语言显示星期几
  const dayChips = [0,1,2,3].map(i=>{
    const d = new Date(Date.now() + i*86400000);
    const label = i===0 ? t('dayToday') : d.toLocaleDateString(t('locale'),{weekday:'short'});
    return `<div class="chip ${selectedDay===i?'active':''}" data-day="${i}">${label}</div>`;
  }).join('');
  bar.innerHTML = opts.map(([k,l])=>`<div class="chip ${filter.type===k?'active':''}" data-f="${k}">${l}</div>`).join('')
    + `<div class="chip ${filter.rain?'active':''}" id="rainChip">${t('filterRain')}</div>`
    + `<span class="chip-sep"></span>`
    + dayChips;
  bar.querySelectorAll('[data-f]').forEach(el=>{
    el.onclick = ()=>{ filter.type = el.dataset.f; renderFilterBar(); rebuildMarkers(); };
  });
  document.getElementById('rainChip').onclick = ()=>{ filter.rain = !filter.rain; renderFilterBar(); rebuildMarkers(); };
  bar.querySelectorAll('[data-day]').forEach(el=>{
    el.onclick = ()=>{
      selectedDay = parseInt(el.dataset.day);
      renderFilterBar();
      rebuildMarkers();
      if(currentSheetCragId && document.getElementById('sheet').classList.contains('open')) renderSheetContent();
    };
  });
}

// --- search ---
// 按岩场名或分区名搜索;匹配到分区时结果里带上分区名提示(比如搜"Zoo"能找到 Kallmünz)
function initSearch(){
  const input = document.getElementById('cragSearch');
  const box = document.getElementById('searchResults');
  input.oninput = ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ box.style.display='none'; box.innerHTML=''; return; }
    const hits = [];
    crags.forEach(c=>{
      if(c.name.toLowerCase().includes(q)){ hits.push({c, sec:null}); return; }
      const sec = [...new Set(c.routes.map(r=>r.sector).filter(Boolean))].find(s=>s.toLowerCase().includes(q));
      if(sec) hits.push({c, sec});
    });
    box.innerHTML = hits.length
      ? hits.slice(0,8).map(h=>`<div class="search-item" data-id="${h.c.id}">${h.c.name}${h.sec?`<span class="sec">→ ${localizeSector(h.sec)}</span>`:''}</div>`).join('')
      : `<div class="search-empty">${t('searchNoResults')}</div>`;
    box.style.display = 'block';
    box.querySelectorAll('.search-item').forEach(el=>{
      el.onclick = ()=>{
        const c = crags.find(x=>x.id===el.dataset.id);
        box.style.display='none'; input.value='';
        map.setView([c.lat, c.lon], 12);
        openSheet(c.id);
      };
    });
  };
  // blur 延迟收起,不然点结果时下拉先消失、点击落空
  input.onblur = ()=> setTimeout(()=>{ box.style.display='none'; }, 200);
}

applyStaticI18n();
renderFilterBar();
initSearch();
initMap();
rebuildMarkers();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
